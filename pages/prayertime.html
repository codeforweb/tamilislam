<script type="text/javascript">

var currentDate = new Date();
var timeFormat = 1;

const CITIES = {
	Chennai: { lat: 13.0827, long: 80.2707 },
	Madurai: { lat: 9.9252, long: 78.1198 },
	Trichy: { lat: 10.7905, long: 78.7047 },
	Bangalore: { lat: 12.9716, long: 77.5946 }
};

function setLocation(lat, long, city) {
	$('latitude').value = lat;
	$('longitude').value = long;
	sessionStorage.setItem('coords', JSON.stringify({ lat, long }));
	if (city) {
		sessionStorage.setItem('selectedCity', city);
	} else {
		sessionStorage.removeItem('selectedCity');
	}
	updateCityButtons();
	displayDay();
	displayMonth(0);
}

function selectCity(city) {
	const coords = CITIES[city];
	if (coords) {
		setLocation(coords.lat, coords.long, city);
	}
}

function updateCityButtons() {
	const selected = sessionStorage.getItem('selectedCity');
	document.querySelectorAll('.city-btn').forEach(btn => {
		btn.classList.toggle('active', btn.dataset.city === selected);
	});
}

window.onload = async () => {

	const getCoords = async () => {
	    const storedCoords = sessionStorage.getItem("coords");
	    if (storedCoords) {
	        return JSON.parse(storedCoords);
	    }

	    const pos = await new Promise((resolve, reject) => {
	        navigator.geolocation.getCurrentPosition(resolve, reject);
	    });

	    const coords = {
	        long: pos.coords.longitude,
	        lat: pos.coords.latitude,
	    };

	    sessionStorage.setItem("coords", JSON.stringify(coords));
	    return coords;
	};

	try {
		const coords = await getCoords();
		$('latitude').value = coords.lat;
		$('longitude').value = coords.long;
	} catch (e) {
		// Geolocation unavailable; user can pick a city or enter coordinates manually
	}

	updateCityButtons();
	displayDay();
	displayMonth(0);

	$('map').innerHTML = '<p>Pick a city or allow location access to calculate prayer times on this device.</p>';

	document.querySelectorAll('.city-btn').forEach(btn => {
		btn.addEventListener('click', () => selectCity(btn.dataset.city));
	});

    document.getElementById('clearSession').addEventListener('click', () => {
        sessionStorage.removeItem("coords");
        sessionStorage.removeItem("selectedCity");
        document.getElementById('latitude').value = "";
        document.getElementById('longitude').value = "";
        updateCityButtons();
    });	
}
	const displayDay=()=>{
		var date = new Date(); // today

		/**   A S T R O  L I B   **/
		const observer = new Astronomy.Observer(parseFloat($('latitude').value), parseFloat($('longitude').value), 0);
		let sunrise  = Astronomy.SearchRiseSet('Sun',  observer, +1, date, 300);
		let sunset   = Astronomy.SearchRiseSet('Sun',  observer, -1, date, 300);
		sunrise = FormatDate(sunrise.date)
		sunset = FormatDate(sunset.date)
		/**   A S T R O  L I B   **/

		prayTimes.adjust( {dhuhr: '5 min', asr: (document.getElementById('hanafi').checked)? 'Hanafi': 'Standard', maghrib: '3 min'} );
		var times = prayTimes.getTimes(date, [$('latitude').value, $('longitude').value],'auto','auto','12h');
		// var times = prayTimes.getTimes(date, [43, -80], -5);
		console.log(times)
		// var list = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha', 'Midnight'];
		var list = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

		var html = '<table id="timetable1">';
		html += '<tr><th colspan="14">'+ date.toDateString()+ '</th></tr><tr>';
		//FormattedDate(date, "d/m/y")

		for(var i in list)	{
			html += '<td><b>'+ list[i];
			html += '</b>: '+ times[list[i].toLowerCase()]+ '</td>';
		}
		html += `<td><b>Sunrise</b>: ${sunrise}</td><td><b>Sunset</b>: ${sunset}</td>`;
		html += '</tr></table>';
		document.getElementById('dailyTimetable').innerHTML = html;
	}

	// display monthly timetable
	function displayMonth(offset) {

		const lat = $('latitude').value;
		const lng = $('longitude').value;
		const timeZone = 'auto';
		const dst = 'auto';
		const format = '12h';

		const Juristic = (document.getElementById('hanafi').checked)? 'Hanafi': 'Standard';

		// var method = $('method').value;
		// prayTimes.setMethod(method);
		// prayTimes.setMethod('Makkah');

		prayTimes.adjust( {dhuhr: '5 min', asr: Juristic, maghrib: '3 min'} );
		currentDate.setMonth(currentDate.getMonth()+ 1* offset);
		let month = currentDate.getMonth();
		const year = currentDate.getFullYear();
		let title = monthFullName(month)+ ' '+ year;
		$('table-title').innerHTML = title;
		makeTable(year, month, lat, lng, timeZone, dst, format);
	}

	// make monthly timetable
	//http://praytimes.org/code/v2/js/examples/monthly.htm
	
	function makeTable(year, month, lat, lng, timeZone, dst, format) {		
		var items = {day: 'Day', fajr: 'Fajr', sunrise: 'Sunrise', 
					dhuhr: 'Dhuhr', asr: 'Asr', 
					maghrib: 'Maghrib', isha: 'Isha'};

				
		var tbody = document.createElement('tbody');
		tbody.appendChild(makeTableRow(items, items, 'head-row'));

		var date = new Date(year, month, 1);
		var endDate = new Date(year, month+ 1, 1);


		while (date < endDate) {
			var times = prayTimes.getTimes(date, [lat, lng], timeZone, dst, format);
			times.day = date.getDate();
			var today = new Date(); 
			var isToday = (date.getMonth() == today.getMonth()) && (date.getDate() == today.getDate());
			var klass = isToday ? 'today-row' : '';
			tbody.appendChild(makeTableRow(times, items, klass));
			date.setDate(date.getDate()+ 1);  // next day
		}
		removeAllChild($('timetable'));
		$('timetable').appendChild(tbody);
	}

	// make a table row
	function makeTableRow(data, items, klass) {
		var row = document.createElement('tr');
		for (var i in items) {
			var cell = document.createElement('td');
			cell.innerHTML = data[i];
			cell.style.width = i=='day' ? '2.5em' : '3.7em';
			row.appendChild(cell);
		}
		row.className = klass;
		return row;		
	}

	// remove all children of a node
	function removeAllChild(node) {
		if (node == undefined || node == null)
			return;

		while (node.firstChild)
			node.removeChild(node.firstChild);
	}

	function monthFullName(month) {
		var monthName = new Array('January', 'February', 'March', 'April', 'May', 'June', 
						'July', 'August', 'September', 'October', 'November', 'December');
		return monthName[month];
	}

	function $(id) {
		return document.getElementById(id);
	}

	function FormattedDate(date, format) {
	    date = date.toJSON().split(/[:/.TZ-]/);
	    return format.replace(/[ymdhis]/g, function (letter) {
	        return parseInt(date["ymdhis".indexOf(letter)]);
	    });
	}
    function Pad(s, w) {
        s = s.toFixed(0);
        while (s.length < w) {
            s = '0' + s;
        }
        return s;
    }	
    function FormatDate(date) {
        var year = Pad(date.getFullYear(), 4);
        var month = Pad(1 + date.getMonth(), 2);
        var day = Pad(date.getDate(), 2);
        var hour24 = Pad(date.getHours(), 2);
    	const hour12 = hour24 % 12 || 12; // Handle midnight (0 becomes 12)
	    const period = hour24 < 12 ? 'AM' : 'PM';

        var minute = Pad(date.getMinutes(), 2);
        var second = Pad(date.getSeconds(), 2);
        return `${year}-${month}-${day} ${hour12}:${minute}:${second} ${period}`;
    }

</script>
